    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafbf9;
            color: #1c1917;
            overflow-x: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Futuristic Smooth Easing Transitions */
        .smooth-view {
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform, filter;
        }

        .view-hidden {
            opacity: 0;
            transform: translateY(14px) scale(0.985);
            filter: blur(8px);
            pointer-events: none;
        }

        .view-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0px);
            pointer-events: auto;
        }

        /* Option buttons styling */
        .option-btn {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .option-btn.selected {
            background-color: #789C4B !important;
            color: #ffffff !important;
            border-color: #789C4B !important;
            box-shadow: 0 4px 14px rgba(120, 156, 75, 0.3);
        }

        .option-btn.selected:hover {
            background-color: #688a3e !important;
        }

        /* Initial Question Entry Animation */
        @keyframes optionAppear {
            0% {
                opacity: 0;
                transform: translateY(8px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .animate-option {
            animation: optionAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered Sequential Reveal for Results */
        .reveal-item {
            opacity: 0;
            transform: translateY(12px);
            filter: blur(6px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-item.revealed {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Animated Underline Widening from Center */
        .reveal-line {
            width: 100%;
            height: 2px;
            background-color: #789C4B;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .reveal-line.revealed {
            transform: scaleX(1);
        }

        /* Begin button interaction */
        .begin-btn {
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .begin-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 24px rgba(120, 156, 75, 0.3);
        }

        .begin-btn:active {
            transform: scale(0.98);
        }

        .nav-btn {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-btn:not(:disabled):hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 18px rgba(120, 156, 75, 0.28);
        }

        .nav-btn:not(:disabled):active {
            transform: translateY(0);
        }
    </style>

            });
        }

        function switchView(fromElement, toElement, onComplete) {
            fromElement.classList.remove('view-visible');
            fromElement.classList.add('view-hidden');
            
            setTimeout(() => {
                fromElement.classList.add('hidden');
                toElement.classList.remove('hidden');
                
                if (onComplete) onComplete();

                void toElement.offsetWidth;

                toElement.classList.remove('view-hidden');
                toElement.classList.add('view-visible');
            }, 350);
        }

        function startTimer() {
            stopTimer();
            const DURATION_MS = 30000;
            endTime = Date.now() + DURATION_MS;
            updateTimerDisplay(DURATION_MS);

            timerInterval = setInterval(() => {
                const remainingMs = Math.max(0, endTime - Date.now());
                updateTimerDisplay(remainingMs);

                if (remainingMs <= 0) {
                    stopTimer();
                    resetToStart();
                }
            }, 10);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay(remainingMs = 30000) {
            const timerElem = document.getElementById('timer-display');
            if (timerElem) {
                const seconds = Math.floor(remainingMs / 1000);
                const milliseconds = Math.floor((remainingMs % 1000) / 10);
                const secStr = seconds.toString().padStart(2, '0');
                const msStr = milliseconds.toString().padStart(2, '0');
                timerElem.innerHTML = `${secStr}<span class="text-base font-semibold">.${msStr}</span>`;
            }
        }

        function resetToStart() {
            stopTimer();
            shuffleQuestions();
            selections = new Array(QUESTIONS.length).fill(null);
            currentIndex = 0;

            const beginBtn = document.getElementById('begin-btn');
            if (beginBtn) {
                beginBtn.innerText = "TRY AGAIN";
            }

            switchView(questionScreen, startScreen);
        }

        function startTest() {
            shuffleQuestions();
            currentIndex = 0;
            selections = new Array(QUESTIONS.length).fill(null);
            switchView(startScreen, questionScreen, () => {
                renderQuestion();
            });
        }

        function renderQuestion() {
            const currentQ = QUESTIONS[currentIndex];
            const stepNum = (currentIndex + 1).toString().padStart(2, '0');

            questionNumber.innerText = `QUESTION ${stepNum} / ${QUESTIONS.length.toString().padStart(2, '0')}`;
            questionText.innerText = getRandomVariant(currentQ.titles);

            optionsContainer.innerHTML = '';
            const selectedKey = selections[currentIndex];

            currentQ.options.forEach((opt, idx) => {
                const isSelected = selectedKey === opt.k;
                const button = document.createElement('button');
                button.type = "button";
                button.className = `option-btn animate-option w-full p-3.5 border rounded-xl text-left text-xs sm:text-sm leading-relaxed flex items-center space-x-3.5 ${
                    isSelected 
                        ? 'selected bg-[#789C4B] text-white border-[#789C4B]' 
                        : 'bg-stone-50/60 text-stone-800 border-stone-200/80 hover:border-[#789C4B]/40 hover:bg-[#789C4B]/5'
                }`;

                button.style.animationDelay = `${idx * 0.04}s`;
                button.onclick = () => selectOption(button, opt.k);

                const currentOptText = getRandomVariant(opt.texts);
                const badgeClass = isSelected
                    ? 'opt-badge font-bold text-[11px] px-2 py-0.5 rounded-md border border-white/40 text-white bg-white/20 pointer-events-none transition-colors'
                    : 'opt-badge font-bold text-[11px] px-2 py-0.5 rounded-md border border-[#789C4B]/30 text-[#789C4B] bg-[#789C4B]/10 pointer-events-none transition-colors';

                button.innerHTML = `
                    <span class="${badgeClass}">${String.fromCharCode(65 + idx)}</span>
                    <span class="flex-1 pointer-events-none font-medium">${currentOptText}</span>
                `;

                optionsContainer.appendChild(button);
            });

            nextBtn.disabled = selections[currentIndex] === null;
            nextBtn.innerText = currentIndex === QUESTIONS.length - 1 ? "FINISH" : "NEXT";

            startTimer();
        }

        function selectOption(clickedBtn, key) {
            selections[currentIndex] = key;

            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            allButtons.forEach(btn => {
                btn.classList.remove('selected');
                btn.classList.add('bg-stone-50/60', 'text-stone-800', 'border-stone-200/80');
                const badge = btn.querySelector('.opt-badge');
                if (badge) {
                    badge.className = 'opt-badge font-bold text-[11px] px-2 py-0.5 rounded-md border border-[#789C4B]/30 text-[#789C4B] bg-[#789C4B]/10 pointer-events-none transition-colors';
                }
            });

            clickedBtn.classList.add('selected');
            clickedBtn.classList.remove('bg-stone-50/60', 'text-stone-800', 'border-stone-200/80');
            
            const selBadge = clickedBtn.querySelector('.opt-badge');
            if (selBadge) {
                selBadge.className = 'opt-badge font-bold text-[11px] px-2 py-0.5 rounded-md border border-white/40 text-white bg-white/20 pointer-events-none transition-colors';
            }

            nextBtn.disabled = false;
        }

        function animateQuestionChange(updateFn) {
            const qText = document.getElementById('question-text');
            const options = document.getElementById('options-container');

            qText.style.opacity = '0';
            qText.style.transform = 'translateY(-6px)';
            qText.style.filter = 'blur(4px)';

            options.style.opacity = '0';
            options.style.transform = 'translateY(8px)';
            options.style.filter = 'blur(4px)';

            setTimeout(() => {
                updateFn();
                
                qText.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
                qText.style.opacity = '1';
                qText.style.transform = 'translateY(0)';
                qText.style.filter = 'blur(0)';

                options.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
                options.style.opacity = '1';
                options.style.transform = 'translateY(0)';
                options.style.filter = 'blur(0)';
            }, 180);
        }

        function nextQuestion() {
            if (selections[currentIndex] === null) return;

            if (currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                animateQuestionChange(() => {
                    renderQuestion();
                });
            } else {
                calculateResults();
            }
        }

        function calculateResults() {
            stopTimer();

            const scores = { _0x1: 0, _0x2: 0, _0x3: 0, _0x4: 0, _0x5: 0 };
            selections.forEach(key => {
                if (key && scores.hasOwnProperty(key)) {
                    scores[key]++;
                }
            });

            let dominantKey = '_0x2';
            let maxVal = -1;
            Object.keys(scores).forEach(k => {
                if (scores[k] > maxVal) {
                    maxVal = scores[k];
                    dominantKey = k;
                }
            });

            document.getElementById('result-title').innerText = TITLES[dominantKey];

            const revealItems = [
                document.getElementById('res-label'),
                document.getElementById('result-title'),
                document.getElementById('res-line'),
                document.getElementById('res-chart-container')
            ];
            
            revealItems.forEach(item => item.classList.remove('revealed'));

            switchView(questionScreen, resultsScreen, () => {
                setTimeout(() => { revealItems[0].classList.add('revealed'); }, 150);
                setTimeout(() => { revealItems[1].classList.add('revealed'); }, 450);
                setTimeout(() => { revealItems[2].classList.add('revealed'); }, 750);
                setTimeout(() => {
                    revealItems[3].classList.add('revealed');
                    renderRadar(scores);
                }, 1100);
            });
        }

        function renderRadar(scores) {
            const ctx = document.getElementById('radarChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: [LABELS._0x1, LABELS._0x2, LABELS._0x3, LABELS._0x4, LABELS._0x5],
                    datasets: [{
                        data: [scores._0x1, scores._0x2, scores._0x3, scores._0x4, scores._0x5],
                        backgroundColor: 'rgba(120, 156, 75, 0.22)',
                        borderColor: '#789C4B',
                        borderWidth: 2,
                        pointBackgroundColor: '#789C4B',
                        pointBorderColor: '#ffffff',
                        pointHoverBackgroundColor: '#ffffff',
                        pointHoverBorderColor: '#789C4B',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 20, bottom: 20, left: 20, right: 20 }
                    },
                    animation: {
                        duration: 1400,
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(120, 156, 75, 0.2)' },
                            grid: { color: 'rgba(120, 156, 75, 0.15)' },
                            pointLabels: {
                                color: '#27272a',
                                font: { size: 10, family: 'ui-sans-serif, system-ui, sans-serif', weight: '600' },
                                padding: 12
                            },
                            ticks: {
                                display: false,
                                stepSize: 2,
                                beginAtZero: true,
                                max: 10
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
